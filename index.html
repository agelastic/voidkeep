<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#000000">
<title>Voidkeep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block}
#view{image-rendering:pixelated;image-rendering:crisp-edges}
#ui{touch-action:none}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="ui"></canvas>
<div id="safe"></div>
<script>
(() => {
'use strict';

// =====================================================================
// Utilities
// =====================================================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// =====================================================================
// Sound (synthesised with WebAudio; unlocked on first touch for iOS)
// =====================================================================
const Sound = (() => {
  let ac = null, master = null, noiseBuf = null, enabled = true;
  function init() {
    try {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
      const len = ac.sampleRate | 0;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const b = ac.createBufferSource(); b.buffer = ac.createBuffer(1, 1, 22050); b.connect(master); b.start(0);
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!ac || !enabled || vol <= 0.001) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, ftype, f0, f1, delay = 0) {
    if (!ac || !enabled || vol <= 0.001) return;
    const t = ac.currentTime + delay;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = ftype;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.03);
  }
  const fx = {
    blaster(k = 1) { tone('square', 900, 170, 0.13, 0.16 * k); noise(0.07, 0.22 * k, 'highpass', 3500, 900); },
    scatter(k = 1) { noise(0.38, 0.6 * k, 'lowpass', 4200, 180); tone('sawtooth', 170, 40, 0.26, 0.22 * k); },
    lance(k = 1) { tone('sawtooth', 320, 1500, 0.09, 0.1 * k); tone('sine', 1300, 600, 0.11, 0.1 * k); },
    orb(k = 1) { tone('triangle', 520, 190, 0.28, 0.13 * k); },
    alert(k = 1) { tone('sawtooth', 95, 55, 0.5, 0.17 * k); tone('square', 150, 70, 0.4, 0.07 * k, 0.05); },
    pain(k = 1) { tone('sawtooth', 280, 120, 0.18, 0.14 * k); },
    death(k = 1) { tone('sawtooth', 240, 38, 0.65, 0.2 * k); noise(0.45, 0.2 * k, 'lowpass', 1300, 90); },
    hurt() { tone('square', 125, 60, 0.2, 0.24); noise(0.16, 0.24, 'lowpass', 900, 100); },
    pickup() { tone('square', 660, 660, 0.06, 0.11); tone('square', 990, 990, 0.08, 0.11, 0.06); },
    weapon() { tone('square', 330, 330, 0.08, 0.13); tone('square', 495, 495, 0.08, 0.13, 0.08); tone('square', 660, 660, 0.12, 0.13, 0.16); },
    door(k = 1) { noise(0.5, 0.22 * k, 'lowpass', 420, 120); tone('sawtooth', 58, 44, 0.5, 0.08 * k); },
    locked() { tone('square', 150, 150, 0.12, 0.14); tone('square', 110, 110, 0.15, 0.14, 0.13); },
    boom(k = 1) { noise(0.95, 0.8 * k, 'lowpass', 2200, 55); tone('sine', 85, 28, 0.85, 0.42 * k); },
    exit() { [523, 659, 784, 1046].forEach((f, i) => tone('square', f, f, 0.15, 0.11, i * 0.12)); },
    melee(k = 1) { noise(0.12, 0.3 * k, 'bandpass', 900, 300); },
    click() { tone('square', 210, 210, 0.04, 0.1); },
    puff(k = 1) { noise(0.05, 0.08 * k, 'highpass', 5000, 2000); },
  };
  return {
    init, fx,
    get on() { return enabled; },
    toggle() { enabled = !enabled; return enabled; },
  };
})();

// =====================================================================
// Texture generation (all art is drawn procedurally at load time)
// =====================================================================
const TS = 64;
const TEXTURES = [];
const TEXN = {};
function pixelsFromCanvas(c, noiseAmt, seed) {
  const g = c.getContext('2d');
  const d = g.getImageData(0, 0, TS, TS).data;
  const R = mulberry32(seed || 1);
  const out = new Uint32Array(TS * TS);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    if (d[i + 3] < 128) { out[j] = 0; continue; }
    let r = d[i], gg = d[i + 1], b = d[i + 2];
    if (noiseAmt) {
      const n = 1 + (R() * 2 - 1) * noiseAmt;
      r = clamp(r * n | 0, 0, 255); gg = clamp(gg * n | 0, 0, 255); b = clamp(b * n | 0, 0, 255);
    }
    out[j] = (0xff000000 | (b << 16) | (gg << 8) | r) >>> 0;
  }
  return out;
}
function draw64(fn, noiseAmt = 0, seed = 1) {
  const c = document.createElement('canvas'); c.width = c.height = TS;
  const g = c.getContext('2d');
  fn(g, mulberry32(seed));
  return pixelsFromCanvas(c, noiseAmt, seed + 101);
}
function addTex(name, px) { TEXN[name] = TEXTURES.length; TEXTURES.push(px); return TEXN[name]; }
const fr = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const ell = (g, x, y, rx, ry, c) => { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); g.fill(); };
const poly = (g, p, c) => { g.fillStyle = c; g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); g.fill(); };
const tint = (g, c) => { g.globalCompositeOperation = 'source-atop'; fr(g, 0, 0, TS, TS, c); g.globalCompositeOperation = 'source-over'; };

function buildWallTextures() {
  addTex('metal', draw64((g, R) => {
    fr(g, 0, 0, 64, 64, '#3e444a');
    for (let py = 0; py < 2; py++) for (let px = 0; px < 2; px++) {
      const x = px * 32, y = py * 32, s = R() * 18 | 0;
      fr(g, x + 2, y + 2, 28, 28, `rgb(${84 + s},${92 + s},${101 + s})`);
      fr(g, x + 2, y + 2, 28, 2, 'rgba(255,255,255,0.14)'); fr(g, x + 2, y + 2, 2, 28, 'rgba(255,255,255,0.1)');
      fr(g, x + 2, y + 28, 28, 2, 'rgba(0,0,0,0.35)'); fr(g, x + 28, y + 2, 2, 28, 'rgba(0,0,0,0.3)');
      [[5, 5], [24, 5], [5, 24], [24, 24]].forEach(([a, b]) => { fr(g, x + a, y + b, 3, 3, '#2a2f34'); fr(g, x + a, y + b, 1, 1, '#9aa3ad'); });
    }
  }, 0.07, 11));
  addTex('tech', draw64((g, R) => {
    fr(g, 0, 0, 64, 64, '#161d24');
    fr(g, 3, 0, 26, 64, '#24303b'); fr(g, 35, 0, 26, 64, '#24303b');
    fr(g, 30, 0, 4, 64, '#0b1015');
    for (let i = 0; i < 6; i++) fr(g, 8, 5 + i * 10, 16, 2, R() < 0.5 ? '#2ee6ff' : '#17708a');
    fr(g, 42, 6, 4, 4, '#ff5a3c'); fr(g, 50, 6, 4, 4, '#3cff7a');
    fr(g, 39, 18, 18, 32, '#13506a');
    for (let i = 0; i < 5; i++) fr(g, 41, 21 + i * 6, (5 + R() * 11) | 0, 2, '#38c8f0');
    fr(g, 39, 54, 18, 4, '#3a4652');
  }, 0.05, 12));
  addTex('stone', draw64((g, R) => {
    fr(g, 0, 0, 64, 64, '#262923');
    let y = 0;
    while (y < 64) {
      const h = 10 + (R() * 7 | 0);
      let x = -(R() * 18 | 0);
      while (x < 64) {
        const w = 14 + (R() * 15 | 0), s = R() * 22 | 0;
        fr(g, x + 1, y + 1, w - 2, h - 2, `rgb(${68 + s},${74 + s},${63 + s})`);
        fr(g, x + 1, y + h - 3, w - 2, 2, 'rgba(0,0,0,0.28)');
        fr(g, x + 1, y + 1, w - 2, 1, 'rgba(255,255,255,0.1)');
        x += w;
      }
      y += h;
    }
  }, 0.12, 13));
  addTex('rust', draw64((g, R) => {
    fr(g, 0, 0, 64, 64, '#2a201b');
    for (let r = 0; r < 4; r++) {
      const off = (r % 2) * 16;
      for (let c = -1; c < 3; c++) {
        const x = c * 32 + off, s = R() * 28 | 0;
        fr(g, x + 1, r * 16 + 1, 30, 14, `rgb(${112 + s},${56 + (s >> 1)},${38})`);
        fr(g, x + 1, r * 16 + 12, 30, 3, 'rgba(0,0,0,0.25)');
        fr(g, x + 1, r * 16 + 1, 30, 2, 'rgba(255,220,180,0.08)');
      }
    }
  }, 0.14, 14));
  addTex('pipes', draw64((g, R) => {
    fr(g, 0, 0, 64, 64, '#1d2125');
    for (let i = 0; i < 4; i++) {
      const x = 2 + i * 16;
      const grd = g.createLinearGradient(x, 0, x + 12, 0);
      grd.addColorStop(0, '#30353b'); grd.addColorStop(0.4, '#9aa3ad'); grd.addColorStop(1, '#25292e');
      g.fillStyle = grd; g.fillRect(x, 0, 12, 64);
      fr(g, x - 1, 14 + i * 9, 14, 4, '#6b4a2f');
    }
  }, 0.06, 15));
  const doorBase = (g) => {
    fr(g, 0, 0, 64, 64, '#5a5f66');
    for (let i = 0; i < 8; i++) fr(g, i * 8, 0, 8, 64, i % 2 ? '#686e75' : '#53585e');
    g.save(); g.beginPath(); g.rect(0, 26, 64, 12); g.clip();
    for (let i = -2; i < 10; i++) poly(g, [i * 8, 26, i * 8 + 8, 26, i * 8 + 16, 38, i * 8 + 8, 38], i % 2 ? '#e0b020' : '#151515');
    g.restore();
    fr(g, 0, 24, 64, 2, '#24272b'); fr(g, 0, 38, 64, 2, '#24272b');
    fr(g, 0, 0, 2, 64, '#2c3035'); fr(g, 62, 0, 2, 64, '#2c3035');
  };
  addTex('door', draw64((g) => doorBase(g), 0.05, 16));
  const keyDoor = (col) => draw64((g) => {
    doorBase(g);
    fr(g, 20, 18, 24, 28, '#1b1e22'); fr(g, 22, 20, 20, 24, col);
    fr(g, 26, 25, 12, 8, '#f2f2f2'); fr(g, 26, 35, 12, 2, '#1b1e22');
  }, 0.04, 17);
  addTex('door_r', keyDoor('#e0303a'));
  addTex('door_u', keyDoor('#2f7bff'));
  addTex('door_y', keyDoor('#f2c21b'));
  addTex('exit', draw64((g) => {
    fr(g, 0, 0, 64, 64, '#1c2227'); fr(g, 5, 5, 54, 54, '#0b0f12');
    g.fillStyle = '#29ff7a'; g.font = 'bold 15px monospace'; g.textAlign = 'center'; g.fillText('EXIT', 32, 24);
    fr(g, 22, 32, 20, 24, '#3a3f45'); fr(g, 26, 36, 12, 10, '#ff3b3b'); fr(g, 26, 36, 12, 3, '#ff9a9a');
  }, 0.03, 18));
  // floors & ceilings
  addTex('floorTile', draw64((g, R) => {
    fr(g, 0, 0, 64, 64, '#2b2e31');
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
      const s = R() * 12 | 0;
      fr(g, x * 32 + 1, y * 32 + 1, 30, 30, `rgb(${62 + s},${66 + s},${70 + s})`);
      fr(g, x * 32 + 1, y * 32 + 1, 30, 1, 'rgba(255,255,255,0.08)');
    }
  }, 0.1, 21));
  addTex('floorGrate', draw64((g) => {
    fr(g, 0, 0, 64, 64, '#3a3e43');
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) fr(g, x * 8 + 2, y * 8 + 2, 5, 5, '#121518');
    fr(g, 0, 0, 64, 1, '#555b61'); fr(g, 0, 0, 1, 64, '#555b61');
  }, 0.08, 22));
  addTex('floorHex', draw64((g, R) => {
    fr(g, 0, 0, 64, 64, '#1e1a24');
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const s = R() * 14 | 0;
      fr(g, x * 16 + 1, y * 16 + 1, 14, 14, `rgb(${48 + s},${40 + s},${60 + s})`);
    }
    fr(g, 30, 30, 4, 4, '#7a40d0');
  }, 0.1, 23));
  addTex('ceilPanel', draw64((g) => {
    fr(g, 0, 0, 64, 64, '#22262a');
    fr(g, 2, 2, 60, 60, '#2c3136');
    fr(g, 20, 20, 24, 24, '#4a5560'); fr(g, 22, 22, 20, 20, '#cfe2f3');
  }, 0.05, 24));
  addTex('ceilDark', draw64((g) => {
    fr(g, 0, 0, 64, 64, '#18191b');
    for (let i = 0; i < 4; i++) fr(g, 0, i * 16 + 6, 64, 4, '#26282b');
    fr(g, 28, 0, 8, 64, '#2b2420');
  }, 0.08, 25));
}

// ---- sprites --------------------------------------------------------
function huskBody(g, m) {
  const sw = m === 'walk1' ? 3 : (m === 'walk0' ? -3 : 0);
  fr(g, 25 + sw, 42, 6, 19, '#3b4630'); fr(g, 34 - sw, 42, 6, 19, '#3b4630');
  fr(g, 23 + sw, 59, 9, 4, '#22281c'); fr(g, 33 - sw, 59, 9, 4, '#22281c');
  ell(g, 32, 34, 12, 13, '#56664a'); ell(g, 32, 37, 9, 9, '#4b5a40');
  g.strokeStyle = '#33402b'; g.lineWidth = 1;
  for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(25, 29.5 + i * 4); g.lineTo(39, 29.5 + i * 4); g.stroke(); }
  if (m === 'attack') {
    fr(g, 14, 12, 6, 22, '#56664a'); fr(g, 44, 12, 6, 22, '#56664a');
    poly(g, [13, 12, 15, 3, 18, 12], '#e1d9bb'); poly(g, [17, 12, 20, 4, 21, 12], '#e1d9bb');
    poly(g, [43, 12, 45, 3, 48, 12], '#e1d9bb'); poly(g, [47, 12, 50, 4, 51, 12], '#e1d9bb');
  } else {
    fr(g, 15, 26 - sw, 6, 20, '#56664a'); fr(g, 43, 26 + sw, 6, 20, '#56664a');
    fr(g, 14, 45 - sw, 8, 4, '#e1d9bb'); fr(g, 42, 45 + sw, 8, 4, '#e1d9bb');
  }
  ell(g, 32, 17, 8, 9, '#6a7a58');
  fr(g, 26, 14, 5, 3, '#ff9a1a'); fr(g, 33, 14, 5, 3, '#ff9a1a');
  fr(g, 28, 21, 8, 3, '#1c1410'); fr(g, 29, 21, 1, 2, '#e1d9bb'); fr(g, 34, 21, 1, 2, '#e1d9bb');
}
function drawHusk(g, m) {
  if (m === 'dead') {
    ell(g, 32, 59, 24, 5, '#3a0d0d'); ell(g, 28, 56, 15, 5, '#4f5c40'); ell(g, 41, 57, 8, 3, '#3c4630');
    ell(g, 19, 55, 5, 4, '#66755a'); fr(g, 17, 54, 2, 1, '#ff9a1a');
    return;
  }
  if (m === 'die0') {
    g.save(); g.translate(32, 62); g.rotate(-0.95); g.translate(-32, -62); huskBody(g, 'walk0'); g.restore();
    ell(g, 30, 61, 16, 3, '#5a1010'); return;
  }
  huskBody(g, m);
  if (m === 'pain') tint(g, 'rgba(255,70,50,0.45)');
}
function drawWisp(g, m) {
  if (m === 'dead') {
    for (let i = 0; i < 7; i++) poly(g, [19 + i * 4, 63, 21 + i * 4, 55 - (i % 3) * 3, 24 + i * 4, 63], i % 2 ? '#7d4fc0' : '#5b2f99');
    ell(g, 32, 62, 15, 2, '#2a1840'); return;
  }
  if (m === 'die0') {
    const gr = g.createRadialGradient(32, 30, 2, 32, 30, 24);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.4, '#e2a8ff'); gr.addColorStop(1, 'rgba(90,40,160,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(32, 30, 24, 0, TAU); g.fill();
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; poly(g, [32 + Math.cos(a) * 18, 30 + Math.sin(a) * 18, 32 + Math.cos(a + 0.2) * 28, 30 + Math.sin(a + 0.2) * 28, 32 + Math.cos(a + 0.35) * 18, 30 + Math.sin(a + 0.35) * 18], '#5b2f99'); }
    return;
  }
  const ph = m === 'walk1' ? 1 : 0;
  g.strokeStyle = '#6a3aa8'; g.lineWidth = 3;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(24 + i * 8, 40); g.quadraticCurveTo(20 + i * 8 + (ph ? 7 : -7), 51, 26 + i * 8, 63); g.stroke(); }
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU + (ph ? 0.2 : 0);
    poly(g, [32 + Math.cos(a) * 13, 30 + Math.sin(a) * 13, 32 + Math.cos(a + 0.25) * 24, 30 + Math.sin(a + 0.25) * 24, 32 + Math.cos(a + 0.5) * 13, 30 + Math.sin(a + 0.5) * 13], '#5b2f99');
  }
  const atk = m === 'attack';
  const gr = g.createRadialGradient(32, 30, 2, 32, 30, 16);
  gr.addColorStop(0, atk ? '#ffffff' : '#ffd2ff'); gr.addColorStop(0.5, atk ? '#ff7ad9' : '#b46cff'); gr.addColorStop(1, '#3a1870');
  g.fillStyle = gr; g.beginPath(); g.arc(32, 30, 16, 0, TAU); g.fill();
  ell(g, 32, 30, 6, atk ? 5 : 3, '#1a0628'); ell(g, 32, 30, 2, 2, '#ffe14a');
  if (m === 'pain') tint(g, 'rgba(255,255,255,0.45)');
}
function bruteBody(g, m) {
  const sw = m === 'walk1' ? 3 : (m === 'walk0' ? -3 : 0);
  fr(g, 19 + sw, 44, 10, 18, '#4a241c'); fr(g, 35 - sw, 44, 10, 18, '#4a241c');
  fr(g, 17 + sw, 58, 14, 5, '#2a1410'); fr(g, 33 - sw, 58, 14, 5, '#2a1410');
  fr(g, 12, 18, 40, 28, '#6e3427'); fr(g, 14, 20, 36, 10, '#83402f'); fr(g, 16, 34, 32, 10, '#5a2b22');
  for (let i = 0; i < 4; i++) fr(g, 17 + i * 9, 37, 3, 3, '#a8a8b0');
  fr(g, 3, 13, 13, 15, '#4f4f57'); fr(g, 48, 13, 13, 15, '#4f4f57');
  fr(g, 5, 24, 9, 17, '#37373e'); fr(g, 50, 24, 9, 17, '#37373e');
  const mz = m === 'attack' ? '#ffe066' : '#141414';
  fr(g, 6, 38, 7, 5, mz); fr(g, 51, 38, 7, 5, mz);
  fr(g, 24, 5, 16, 15, '#5a2b22'); fr(g, 25, 10, 14, 4, m === 'attack' ? '#c8ff9a' : '#47e06a');
}
function drawBrute(g, m) {
  if (m === 'dead') {
    ell(g, 32, 59, 28, 5, '#3a0d0d'); ell(g, 32, 55, 22, 7, '#5a2b22'); fr(g, 18, 52, 28, 4, '#3d1d17');
    fr(g, 6, 54, 12, 6, '#4f4f57'); fr(g, 41, 50, 8, 3, '#2c7a3e'); return;
  }
  if (m === 'die0') { g.save(); g.translate(32, 63); g.rotate(0.75); g.translate(-32, -63); bruteBody(g, 'walk0'); g.restore(); return; }
  bruteBody(g, m);
  if (m === 'pain') tint(g, 'rgba(255,80,60,0.45)');
}
function wardenBody(g, m) {

      else role = 'look';
    }
    touches.set(t.identifier, { role, x0: x, y0: y, x, y, lx: x });
  }
  input.fire = [...touches.values()].some(t => t.role === 'fire');
  updateStick();
}, { passive: false });
ui.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const o = touches.get(t.identifier); if (!o) continue;
    o.x = t.clientX; o.y = t.clientY;
    if ((o.role === 'look' || o.role === 'fire') && G.mode === 'play') { input.look += (o.x - o.lx) * 0.0075 / C.s; }
    o.lx = o.x;
  }
  updateStick();
}, { passive: false });
const endTouch = (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const o = touches.get(t.identifier);
    touches.delete(t.identifier);
    if (o && o.role === 'tap') handleTap(t.clientX, t.clientY);
  }
  input.fire = [...touches.values()].some(t => t.role === 'fire');
  updateStick();
};
ui.addEventListener('touchend', endTouch, { passive: false });
ui.addEventListener('touchcancel', endTouch, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', (e) => e.preventDefault());

// mouse / keyboard (desktop testing)
ui.addEventListener('mousedown', (e) => {
  if (G.touchSeen) return;
  Sound.init(); G.mouseSeen = true;
  if (G.mode === 'play') {
    if (hitC(C.pause, e.clientX, e.clientY, 1.3)) { setPaused(true); return; }
    if (document.pointerLockElement !== ui && ui.requestPointerLock) { try { ui.requestPointerLock(); } catch (err) { /* ignore */ } }
    G.mouseFire = true;
  } else handleTap(e.clientX, e.clientY);
});
window.addEventListener('mouseup', () => { G.mouseFire = false; });
document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement !== ui && G.mode === 'play' && !G.touchSeen) setPaused(true); });
window.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === ui && G.mode === 'play') input.look += e.movementX * 0.0028;
});
window.addEventListener('keydown', (e) => {
  Sound.init();
  keys[e.code] = true;
  if (e.code === 'Tab') { e.preventDefault(); if (G.mode === 'play') cycleWeapon(); }
  if (G.mode === 'play') {
    if (e.code === 'Digit1') selectWeapon('blaster');
    if (e.code === 'Digit2') selectWeapon('scatter');
    if (e.code === 'Digit3') selectWeapon('lance');
    if (e.code === 'KeyM') G.showMap = !G.showMap;
    if (e.code === 'KeyP' || e.code === 'Escape') setPaused(true);
  } else if (G.mode === 'paused' && (e.code === 'KeyP' || e.code === 'Escape')) setPaused(false);
  else if (e.code === 'Enter' || e.code === 'Space') handleTap(cssW / 2, cssH / 2);
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; G.mouseFire = false; });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

// =====================================================================
// Main loop
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (G.mode === 'play' && !(cssH > cssW)) update(dt);
  else {
    G.time += dt;
    if (G.mode === 'title') { P.a += dt * 0.18; }
    if (G.mode === 'dead') G.deadT = (G.deadT || 0) + dt;
    if (G.mode === 'done' || G.mode === 'win') G.doneT = (G.doneT || 0) + dt;
    P.hurt = Math.max(0, P.hurt - dt * 0.5);
    for (let i = effects.length - 1; i >= 0; i--) { effects[i].t += dt; if (effects[i].t >= effects[i].dur) effects.splice(i, 1); }
  }
  render();
  drawUI();
  // adaptive resolution: if frames are consistently slow, lower the internal render size
  if (G.mode === 'play' && G.quality > 0.66) {
    G.perfN++; G.perfT += dt;
    if (G.perfN >= 90) {
      if (G.perfT / G.perfN > 0.026) { G.quality = Math.max(0.65, G.quality - 0.12); resize(); }
      G.perfN = 0; G.perfT = 0;
    }
  }
  requestAnimationFrame(frame);
}

// boot
buildWallTextures();
buildSprites();
resize();
loadLevel(0);
P.x = 12.5; P.y = 5.5;
G.mode = 'title';
requestAnimationFrame(frame);

// test hook (read-only use in automated checks)
window.__voidkeep = { G, P, get enemies() { return enemies; }, get items() { return items; }, get doors() { return doors; }, loadLevel, newGame, update, input, LEVELS };
})();
</script>
